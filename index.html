function hashStr(s) {
  let h = 0;
  for (let i = 0; i < (s || "").length; i++) h = h * 31 + s.charCodeAt(i) >>> 0;

}
function dayAccent(day) {
  if (!day) return "#2F80FF";

  const n = (day.name || "").toLowerCase();

  if (n.includes("lower")) return "#FF7A45"; // orange
  if (n.includes("push")) return "#00C2FF"; // cyan
  if (n.includes("pull")) return "#7A5CFF"; // purple
  if (n.includes("leg")) return "#FFB020"; // amber

const DOW_SHORT = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const DOW_FULL = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
function abbrevName(name) {
  const words = (name || "").replace(/[·+/]/g, " ").split(/\s+/).filter(Boolean);
  if (!words.length) return "Day";
  const last = words[words.length - 1];
  if (/^[A-Da-d]$/.test(last) && words.length >= 2) return words[0].slice(0, 2) + " " + last.toUpperCase();
  if (words.length === 1) return words[0].slice(0, 5);
  return words.map(w => w[0]).join("").slice(0, 4).toUpperCase();
}
function rebuildPlan(days) {
  // Paused days stay in saved plan data but are excluded from the active week / calendar
  const sorted = [...(days || []).filter(d => !d.paused)].sort((a, b) => (a.weekday ?? 9) - (b.weekday ?? 9));
  PLAN = [{
    ...CHECKIN_DAY,
    weekday: 0

    id: d.id,
    name: d.name,
    kind: d.kind,
    exercises: d.exercises,
    weekday: d.weekday
  }))];
  PLAN.forEach(p => {
    p.label = DOW_FULL[p.weekday] || "Day";

  WEEK_ORDER = PLAN.map(p => p.id);
  TRAINING_ORDER = sorted.map(d => d.id);
  SCHEDULE = {
    0: "d7"

  sorted.forEach(d => {
    if (d.weekday >= 1 && d.weekday <= 6) SCHEDULE[d.weekday] = d.id;

    d7: "Check"
  };
  sorted.forEach(d => {
    ABBR[d.id] = d.kind === "checkin" ? "Check" : abbrevName(d.name);
  });
}

// One-time upgrade of saved gyms to the richer equipment list (old "cardio" flag = pre-upgrade data)
function migrateGyms(gyms) {
  if (!gyms) return DEFAULT_GYMS;
  return gyms.map(g => {
    const old = g.equip || [];
    if (!old.includes("cardio")) return {
      ...g,
      equip: old.filter(e => ALL_EQUIP.includes(e))
    };
    let equip = g.id === "home" ? [...ALL_EQUIP] : old.filter(e => e !== "cardio").concat(["treadmill", "bike", "rower"]);
    return {
      ...g,
      equip: [...new Set(equip)].filter(e => ALL_EQUIP.includes(e))
    };
  });
}

// two-link inverse kinematics: returns [upperAngle, lowerAngle] reaching `target`
function fik(origin, target, l1, l2, bend) {
  let dx = target[0] - origin[0],
    dy = target[1] - origin[1];
  let d = Math.sqrt(dx * dx + dy * dy);
  const max = l1 + l2 - 0.01,
    min = Math.abs(l1 - l2) + 0.01;
  if (d > max) {
    dx *= max / d;
    dy *= max / d;
    d = max;
  }
  if (d < min) {
    if (d < 0.01) {
      dx = 0;
      dy = min;
      d = min;
    } else {
      dx *= min / d;
      dy *= min / d;
      d = min;
    }
  }
  const base = Math.atan2(dx, -dy);
  const cosA = (d * d + l1 * l1 - l2 * l2) / (2 * d * l1);
  const a = Math.acos(Math.max(-1, Math.min(1, cosA)));

// Pull a numeric weight out of a load string; null = bodyweight/cardio (no adaptation)
function parseLoad(str) {
  if (!str) return null;
  if (/min|incline|%/i.test(str)) return null;
  const m = str.match(/(\d+(?:\.\d+)?)/);
  return m ? parseFloat(m[1]) : null;
}
function round5(x) {
  return Math.max(5, Math.round(x / 5) * 5);
}
// Highest weight actually logged across a set list
function maxLogged(sets) {
  let mx = null;
  sets.forEach(s => {
    const v = parseFloat(s.weight);
    if (!isNaN(v)) mx = mx === null ? v : Math.max(mx, v);
  });
  return mx;
}
// Next session's suggestion given how the lift felt
function nextLoad(base, feedback) {
  if (feedback === "hard") return round5(base * 0.9); // struggled → back off ~10%
  if (feedback === "easy") return round5(base * 1.075); // too light → add ~7–8%
  return round5(base); // just right → repeat
}

// Weekly check-in engine — a check-in reshapes the NEXT week
// ============================================================
function computeWeekFocus(checkins) {
  const last = checkins && checkins.length ? checkins[checkins.length - 1] : null;
  // Week 1 runs the plan as written — a baseline + a first Sunday scan 3 days apart
  // isn't a training week yet, so there's nothing meaningful to react to.
  if (!checkins || checkins.length < 3) {
    const firstEver = !checkins || checkins.length < 2;
    return {
      emphasis: "balanced",
      headline: firstEver ? "Baseline set — log your Sunday check-in to kick off week 1." : "Week 1 locked in — run the plan as written. I'll start tailoring your week next Sunday, once there's a full training week to measure.",
      adjustments: firstEver ? ["Progress a lift ~5 lb whenever you hit the top of its rep range."] : ["Follow the 6 training days as written and log every session.", "Rate each workout so daily weights self-adjust as you go.", "Next Sunday's check-in shapes week 2 from your real trend."],
      date: last ? last.date : null
    };
  }
  const cur = checkins[checkins.length - 1];
  const prev = checkins[checkins.length - 2];
  const dW = cur.weight - prev.weight;
  const dF = cur.bodyFat - prev.bodyFat;
  const dM = cur.muscle - prev.muscle;
  const dV = cur.visceral - prev.visceral;
  const losingMuscle = dM <= -0.6;
  const fatStalled = dW >= -0.3 && dF >= -0.2; // weight & fat barely moving (or up)

  let emphasis, headline, adjustments;
  if (losingMuscle) {
    emphasis = "muscle";
    headline = "Muscle dipped this week — easing the deficit and adding lifting volume.";
    adjustments = ["Bring calories up ~150/day and push protein to 150–180g.", "Main compound each day (squat, bench, deadlift, row): +1 set.", "Rest a bit longer on the big lifts (~2 min)."];
  } else if (fatStalled) {
    emphasis = "fatloss";
    headline = "Fat loss stalled — adding conditioning and tightening rest this week.";
    adjustments = ["A 10-minute incline-walk finisher is added to your lifting days.", "Trim rest to ~60s on isolation work to keep the heart rate up.", "Hold calories near 1,650 and keep daily steps high."];
  } else {
    emphasis = "balanced";
    headline = "On track — fat trending down, muscle holding. Keep progressing the weights.";
    adjustments = ["Add ~5 lb to any lift you hit at the top of its rep range.", "Everything else stays the same — it's working."];
  }
  if (dV <= -1) adjustments.push(`Visceral fat dropped ${Math.abs(dV)} point${Math.abs(dV) > 1 ? "s" : ""} — the cardio is paying off, keep it in.`);
  return {
    emphasis,
    headline,
    adjustments,
    date: cur.date
  };
}

// Apply the week's focus to a lifting day (adds a finisher or a set)
function applyWeekFocus(day, focus) {
  if (!day || !focus || day.kind) return day; // only plain lifting days
  let exercises = day.exercises.map(e => ({

  if (focus.emphasis === "fatloss") {

function calibrateLoads(tests) {
  const anchors = {};
  ["push", "pull", "squat", "hinge"].forEach(k => {
    const t = tests[k];
    const w = t ? parseFloat(t.w) : NaN,
      r = t ? parseFloat(t.r) : NaN;
    if (w > 0 && r > 0) anchors[k] = w * (1 + r / 30) * 0.72; // e1RM (Epley) → ~8–10 rep working weight
  });
  const seed = {};
  Object.keys(LOAD_COEF).forEach(name => {
    const c = LOAD_COEF[name];
    const base = anchors[c.base];
    if (!base) return; // that pattern was skipped → keep the default suggestion
    let val = Math.round(base * c.f / 5) * 5;
    if (val < 5) val = 5;
    seed[name] = {
      load: `${val} lb${c.each ? " each" : ""}`,
      from: val,
      dir: "same",
      calibrated: true
    };
  });
  return seed;
}

  TRAINING_ORDER.forEach(id => {
    const day = PLAN.find(p => p.id === id);
    if (!day || day.kind) return; // only lifting days rotate; conditioning stays fixed
    const used = new Set();
    curated[id] = day.exercises.map(slot => {
      const lib = EXERCISE_LIBRARY.find(e => e.name === slot.name);
      if (!lib || lib.role === "anchor") {
        used.add(slot.name);
        return {
          ...slot
        }; // keep the core compound for progression
      }
      const pick = pickAccessory(slot.muscle, prefs, used);
      if (!pick) {
        used.add(slot.name);
        return {
          ...slot
        };
      }
      used.add(pick.name);
      return {
        ...slot,
        name: pick.name,
        muscle: pick.muscle,
        load: suggestLoad(pick.name)
      }; // same slot/prescription, new movement
    });
  });
  return curated;
}
